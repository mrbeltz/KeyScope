<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0420"/>
      <stop offset="0.6" stop-color="#2a0f55"/>
      <stop offset="1" stop-color="#0b0420"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c80e"/>
      <stop offset="0.5" stop-color="#ff6c3a"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="512" height="232"/>
      <rect x="0" y="240" width="512" height="14"/>
      <rect x="0" y="262" width="512" height="10"/>
      <rect x="0" y="280" width="512" height="7"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <circle cx="256" cy="228" r="112" fill="url(#sun)" clip-path="url(#sunclip)"/>
  <g stroke="#05d9e8" stroke-opacity="0.7" stroke-width="3">
    <line x1="0" y1="300" x2="512" y2="300"/>
    <line x1="0" y1="330" x2="512" y2="330"/>
    <line x1="0" y1="372" x2="512" y2="372"/>
    <line x1="0" y1="430" x2="512" y2="430"/>
    <line x1="256" y1="300" x2="256" y2="512"/>
    <line x1="200" y1="300" x2="100" y2="512"/>
    <line x1="312" y1="300" x2="412" y2="512"/>
    <line x1="144" y1="300" x2="-40" y2="512"/>
    <line x1="368" y1="300" x2="552" y2="512"/>
  </g>
  <!-- Film-frame brackets -->
  <g fill="none" stroke="#ff2a6d" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <path d="M104 150 V110 H164"/>
    <path d="M408 150 V110 H348"/>
    <path d="M104 362 V402 H164"/>
    <path d="M408 362 V402 H348"/>
  </g>
</svg>
