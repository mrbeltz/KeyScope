name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: keyscope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Attaches the APK to a rolling "latest" release so the phone can download it
      # straight from the releases page without signing in to Actions.
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk keyscope-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest keyscope-debug.apk \
            --title "KeyScope debug build" \
            --notes "Built from ${{ github.sha }}."

      # Last, so a failing test turns the run red without withholding the APK.
      - name: Run DSP tests
        run: gradle test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
